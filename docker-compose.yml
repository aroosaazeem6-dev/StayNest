# =============================================================================
# StayNest - Docker Compose (Development Environment)
# =============================================================================
# Starts PostgreSQL, Redis, and MinIO for local development.
#
# Usage:
#   docker compose up -d       # start all services
#   docker compose down -v     # stop and remove volumes
#   docker compose ps          # check status
#   docker compose logs -f     # tail logs
# =============================================================================

name: staynest

services:
  postgres:
    image: postgres:17-alpine
    container_name: staynest-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-staynest}
      POSTGRES_USER: ${POSTGRES_USER:-staynest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staynest_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - staynest-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-staynest} -d ${POSTGRES_DB:-staynest}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: staynest-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - staynest-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: staynest-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - staynest-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  staynest-network:
    driver: bridge